<style>
/* Layout: phone-first app shell. Compact top bar, one 640px column, fixed bottom tab bar. Ink-navy surfaces for focus moments, tram-yellow only for primary actions and progress. */
:root{
  --paper:#EDF0F4; --card:#FFFFFF; --ink:#142033; --muted:#566377; --line:#D3DAE3;
  --accent:#F0B814; --accent-ink:#1A1300; --blue:#1F4FD1; --blue-soft:#E3EAFB;
  --good:#1D7F4A; --good-soft:#E1F3E8; --bad:#B8342A; --bad-soft:#FBE6E3; --warn:#9A6400; --warn-soft:#FBF0D6;
  --display:"Unbounded",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1520; --card:#17202D; --ink:#E6EBF2; --muted:#98A4B6; --line:#2A3546;
  --accent:#F2C230; --accent-ink:#1A1300; --blue:#86A6FF; --blue-soft:#1D2A44;
  --good:#53C485; --good-soft:#15291E; --bad:#F27B6F; --bad-soft:#331917; --warn:#F2C230; --warn-soft:#2E2610; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1520; --card:#17202D; --ink:#E6EBF2; --muted:#98A4B6; --line:#2A3546;
  --accent:#F2C230; --accent-ink:#1A1300; --blue:#86A6FF; --blue-soft:#1D2A44;
  --good:#53C485; --good-soft:#15291E; --bad:#F27B6F; --bad-soft:#331917; --warn:#F2C230; --warn-soft:#2E2610; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.brand i{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px;font-size:14px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pill svg{width:14px;height:14px}
main{padding-block:18px calc(var(--navh) + 32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
body.focus main{padding-bottom:180px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh)}
nav.tabs button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--ink)}
nav.tabs button[aria-current="true"] svg{stroke:var(--ink)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);top:0;left:50%;transform:translateX(-50%)}
h1,h2{font-family:var(--display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:21px;line-height:1.25}
h2{font-size:16px;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.ghost{border-color:transparent;background:var(--blue-soft);color:var(--blue)}
.btn.wide{width:100%;padding:14px;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
select,input[type=date],input[type=text],textarea{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:100%}
textarea{width:100%;min-height:200px;resize:vertical;line-height:1.55}
input[type=text]{width:100%;font-size:18px}
/* Home hero */
.hero{background:var(--ink);color:var(--card);border:0;padding:18px}
.hero .muted{color:color-mix(in srgb,var(--card) 65%,var(--ink))}
.hero-top{display:flex;gap:16px;align-items:center}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;text-align:center}
.ring b small{display:block;font-family:var(--body);font-size:11px;font-weight:500;opacity:.7}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal{border:1px solid color-mix(in srgb,var(--card) 16%,transparent);border-radius:12px;padding:10px;text-align:left;background:none;color:inherit;display:flex;flex-direction:column;gap:6px}
.goal span{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.goal em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.75;font-weight:500}
.mini{height:4px;border-radius:9px;background:color-mix(in srgb,var(--card) 16%,transparent);overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);border-radius:9px}
.goal.ok{border-color:var(--accent)}
.cta{display:flex;align-items:center;gap:14px;text-align:left;border:0;width:100%;border-radius:16px;padding:16px;background:var(--accent);color:var(--accent-ink)}
.cta b{font-family:var(--display);font-weight:700;font-size:17px;display:block}
.cta span{font-size:14px;opacity:.85}
.cta .arr{margin-left:auto;font-size:24px;font-weight:700}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--good);flex:none}
.task label{flex:1;min-width:0}
.task.done label{text-decoration:line-through;color:var(--muted)}
.task .go{flex:none;border:0;background:var(--blue-soft);color:var(--blue);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.weeks{display:flex;flex-direction:column;gap:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:12px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0}
.dot.full{background:var(--good);color:var(--card);border-color:var(--good)}
.dot.part{background:var(--good-soft);border-color:var(--good)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dot.sel{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* Words */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:12px;background:var(--paper);padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.wrow .pl{font-weight:600}
.wrow .ru{font-size:14px;color:var(--muted);grid-column:1}
.lv{grid-row:1/3;grid-column:2;align-self:center;display:flex;gap:3px}
.lv i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--good)}
/* Session */
.sbar{display:flex;align-items:center;gap:12px}
.sbar .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px}
.prog{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.stage{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.kind{font-size:13px;font-weight:600;color:var(--muted)}
.big{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.2;text-wrap:balance}
.intro{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.intro .tr{font-size:19px;color:var(--blue);font-weight:600}
.ex{font-size:17px;line-height:1.5}
.ex b,.ex .gap{color:var(--blue);font-weight:600}
.gap{display:inline-block;min-width:80px;border-bottom:2px solid var(--blue);text-align:center}
.exru{font-size:14px;color:var(--muted)}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:12px;padding:13px 15px;font-size:17px;font-weight:500}
.opt:active{transform:translateY(1px)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.pick{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:38px;padding:7px 0;font-size:17px;font-weight:600}
.say{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:0;background:var(--blue-soft);color:var(--blue);flex:none}
.say svg{width:20px;height:20px;fill:currentColor}
.bigsay{width:96px;height:96px;align-self:center}
.bigsay svg{width:40px;height:40px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:16px;border-top:2px solid}
.sheet .wrap{display:flex;flex-direction:column;gap:8px}
.sheet.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sheet.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sheet.accent{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.sheet h2{font-size:18px}
.sheet .ex{color:var(--ink);font-size:15px}
.sheet .btn{width:100%;padding:14px;border:0;color:var(--card)}
.sheet.ok .btn{background:var(--good)} .sheet.no .btn{background:var(--bad)} .sheet.accent .btn{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(100%)}to{transform:none}}
 .pop{animation:pop .3s ease-out}@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}}
/* Pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.pc{border:1.5px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:12px;padding:12px 8px;font-size:15px;font-weight:500;min-height:56px;overflow-wrap:anywhere}
.pc.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.pc.done{opacity:.25;pointer-events:none}
.pc.err{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* Misc */
.q{font-size:18px;font-weight:500;line-height:1.45}
.q mark{background:var(--blue-soft);color:var(--blue);border-radius:4px;padding:0 4px}
.explain{border-left:3px solid var(--blue);padding:4px 0 4px 12px;font-size:15px}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.reading{font-size:17px;line-height:1.65;background:var(--paper);border-radius:12px;padding:14px 16px}
.diff span{border-radius:4px;padding:0 3px}
.diff .w{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.diff .r{background:var(--good-soft);color:var(--good)}
.timer{font-family:var(--display);font-weight:700;font-size:52px;font-variant-numeric:tabular-nums;line-height:1}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600}
.tbl td:first-child{font-weight:600;white-space:nowrap}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part{border:1px solid var(--line);border-radius:12px;padding:12px}
.part b{display:block;margin-bottom:2px}
.result{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.pass{color:var(--good)} .fail{color:var(--bad)}
.center{align-items:center;text-align:center}
a{color:var(--blue)}
@media (max-width:420px){.parts{grid-template-columns:1fr}.big{font-size:25px}.ring{width:80px;height:80px}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.dot,.pc{transition:background .15s,border-color .15s}}
.say.sm{width:32px;height:32px;vertical-align:middle}.say.sm svg{width:15px;height:15px}
.built{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:8px}
.pool,.errline{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:1.5px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:10px;padding:8px 11px;font-size:16px;font-weight:500}
.tile.used{opacity:.25}
.tile.bad{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.tile.miss{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.explain.ok{border-color:var(--good)}.explain.no{border-color:var(--bad)}.explain.accent{border-color:var(--warn)}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps span{flex:none;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.steps span.cur{background:var(--ink);color:var(--card);border-color:var(--ink)}
.steps span.done{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.mres{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-size:14px;font-weight:600}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.mbar{position:relative;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px}.mbar i.g{background:var(--good)}.mbar i.b{background:var(--bad)}
.mbar em{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
</style>
</head>

<header>
  <div class="wrap top">
    <div class="brand">Zdam <i>B1</i></div>
    <div class="pills" id="pills"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<nav class="tabs" id="nav"><div class="wrap" id="navin"></div></nav>
<div id="sheet"></div>

let plVoice=null,nVoices=0,ttsHeard=false,ttsFailed=false;
const ttsOK=(()=>{try{return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined"}catch(e){return false}})();
function loadVoices(){try{const v=speechSynthesis.getVoices();nVoices=v.length;plVoice=v.find(x=>/^pl/i.test(x.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.addEventListener("voiceschanged",loadVoices);setTimeout(loadVoices,800);setTimeout(()=>{loadVoices();if(R.tab==="home"||R.tab==="words")render()},2500)}catch(e){}
let ttsUnlocked=false;
document.addEventListener("pointerdown",()=>{if(ttsUnlocked||!ttsOK)return;ttsUnlocked=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}},{capture:true});
function say(t,rate,onend){if(!ttsOK)return;try{
  const s=speechSynthesis;if(!plVoice)loadVoices();
  const u=new SpeechSynthesisUtterance(String(t).replace(/[{}]/g,""));u.lang="pl-PL";if(plVoice)u.voice=plVoice;u.rate=rate||.9;
  u.onstart=()=>{ttsHeard=true};u.onend=()=>{onend&&onend()};
  u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled"){ttsFailed=true;showTtsNote()}};
  const go=()=>{try{s.resume()}catch(e){}s.speak(u)};
  if(s.speaking||s.pending){s.cancel();setTimeout(go,80)}else go();
  setTimeout(()=>{if(!ttsHeard&&!s.speaking){ttsFailed=true;showTtsNote()}},2500);
}catch(e){ttsFailed=true;showTtsNote()}}

function revType(w){const l=lvl(w.id);const o=l<=2?["mc_ru","cloze","mc_ru"]:["type","cloze","cloze"];if(l>=3&&ttsOK)o.push("listen");return o[Math.random()*o.length|0]}
function startSession(deck){
  const due=dueWords().sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due).slice(0,25);
  const fresh=W.filter(w=>!S.srs[w.id]&&(!deck||w.t===deck)).slice(0,S.newPer);
  const rev=shuffle(due.map(w=>({type:revType(w),id:w.id})));
  const chunks=[];
  for(let i=0;i<fresh.length;i+=3){const g=fresh.slice(i,i+3).map(w=>w.id);
    chunks.push([...g.map(id=>({type:"intro",id,isNew:1})),...shuffle(g).map(id=>({type:"mc_pl",id,isNew:1})),...shuffle(g).map(id=>({type:"mc_ru",id,isNew:1})),...shuffle(g).map(id=>({type:"cloze",id,isNew:1,last:1}))])}
  const q=[];let ri=0;for(const c of chunks){q.push(...rev.slice(ri,ri+3));ri+=3;q.push(...c)}q.push(...rev.slice(ri));
  sess=q.length?{q,pos:0,ok:0,n:0,xp:0,newIds:fresh.map(w=>w.id),failed:new Set(),fb:null,pick:null,input:""}:{q:[],empty:true};
  render();window.scrollTo(0,0);
}
function distract(w,field){const same=shuffle(W.filter(x=>x.t===w.t&&x!==w&&x[field]!==w[field])),other=shuffle(W.filter(x=>x.t!==w.t&&x[field]!==w[field]));
  const out=[];for(const x of [...same,...other]){if(!out.includes(x[field]))out.push(x[field]);if(out.length===3)break}return shuffle([w[field],...out])}
const KIND={intro:"Новое слово",mc_pl:"Выбери перевод",mc_ru:"Выбери польское слово",cloze:"Вставь слово в предложение",type:"Напиши по-польски",listen:"Послушай и напиши"};

function answer(res){
  const it=sess.q[sess.pos],w=WI[it.id],good=res!=="no";
  sess.fb=res;sess.n++;if(good)sess.ok++;
  const gain=res==="ok"?10:res==="accent"?8:0;sess.xp+=gain;addXP(gain,"w");
  const now=Date.now(),r=S.srs[w.id]||(S.srs[w.id]={l:1,due:now});
  if(!good){sess.failed.add(w.id);sess.q.splice(Math.min(sess.q.length,sess.pos+4),0,{type:it.type==="listen"||it.type==="type"?"cloze":it.type,id:w.id,isNew:it.isNew,retry:1,last:it.last})}
  if(!it.isNew&&!it.retry){if(good){r.l=Math.min(6,r.l+1);r.due=now+INT[r.l]*DAY}else{r.l=Math.max(1,r.l-2);r.due=now+DAY}}
  if(it.isNew&&it.last&&good){r.l=1;r.due=now+DAY}

}

    sub.innerHTML=`<section class="panel"><h1>Пробный экзамен</h1><p>Четыре части, как в письменной части настоящего экзамена. В конце — процент по каждой части. Чтобы «сдать», нужно ≥50% в каждой.</p>
      <ul class="clean small"><li><b>Słuchanie</b> — 3 записи, 9 вопросов</li><li><b>Gramatyka</b> — 14 вопросов на выбор + 6 форм</li><li><b>Czytanie</b> — 2 текста</li><li><b>Pisanie</b> — 1 письмо, 30 минут, самопроверка по критериям</li></ul>
      <p class="small muted">Займёт около 60–70 минут. Отвечай без подсказок и шпаргалки.</p>
      <button class="btn primary wide" id="mstart">Начать</button></section>
      ${S.mocks.length?`<section class="panel"><h2>Прошлые попытки</h2>${S.mocks.slice(-6).reverse().map(m=>`<div class="row between small" style="border-top:1px solid var(--line);padding-top:8px"><span>${esc(m.date)}</span><span class="score">${MPARTS.map((p,i)=>`<span class="${m.parts[i]>=50?"pass":"fail"}">${m.parts[i]}%</span>`).join(" · ")}</span></div>`).join("")}</section>`:""}`;
    $("#mstart").onclick=()=>{mx.step=0;render();window.scrollTo(0,0)};return}
  if(mx.step===0){const qs=mockLQ();
    sub.innerHTML=stepper+mx.listen.map((L,li)=>{const D=LISTEN[L.i];return `<section class="panel"><div class="row between"><h2>Запись ${li+1}</h2>${ttsOK?`<button class="btn primary" data-play="${li}" ${L.plays>=2?"disabled":""}>▶ Слушать (${2-L.plays} из 2)</button>`:""}</div>
      ${!ttsOK?ttsNoteHTML():""}${D.q.map((q,k)=>{const key=li+"-"+k;return `<p class="q" style="font-size:16px">${esc(q[0])}</p><div class="opts">${q[1].map((o,j)=>`<button class="opt ${mx.la[key]===j?"pick":""}" data-ml="${key}-${j}">${esc(o)}</button>`).join("")}</div>`}).join("")}</section>`}).join("")+
      `<section class="panel"><button class="btn primary wide" id="mnext" ${Object.keys(mx.la).length<qs.length?"disabled":""}>Дальше: грамматика</button></section>`;
    sub.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{const L=mx.listen[+b.dataset.play];if(L.plays>=2)return;L.plays++;sayAll(LISTEN[L.i].x,.92);b.textContent=`▶ Слушать (${2-L.plays} из 2)`;if(L.plays>=2)b.disabled=true});
    sub.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{const p=b.dataset.ml.split("-");mx.la[p[0]+"-"+p[1]]=+p[2];keepScroll()});
    $("#mnext").onclick=()=>{mx.score[0]=Math.round(qs.filter(x=>mx.la[x.key]===x.q[2]).length/qs.length*100);mx.step=1;render();window.scrollTo(0,0)};return}
  if(mx.step===1){const total=mx.gram.length+mx.forms.length,answered=Object.keys(mx.ga).length+Object.values(mx.fa).filter(v=>v.trim()).length;
    sub.innerHTML=stepper+mx.gram.map((gi,k)=>{const g=GRAM[gi];return `<section class="panel"><p class="xs muted">${k+1}</p><p class="q" style="font-size:16px">${esc(g[1]).replace("___","<mark>___</mark>")}</p><div class="opts">${g[2].map((o,j)=>`<button class="opt ${mx.ga[k]===j?"pick":""}" data-mg="${k}-${j}">${esc(o)}</button>`).join("")}</div></section>`}).join("")+
      `<section class="panel" data-keybox><h2>Поставь слова в нужную форму</h2>${mx.forms.map((fi,k)=>{const f=FORMS[fi];return `<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px"><p>${esc(f[0])} <span class="muted small">(${esc(f[1])})</span></p><input type="text" data-mf="${k}" value="${esc(mx.fa[k]||"")}" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl"></div>`}).join("")}${KEYS()}</section>
      <section class="panel"><button class="btn primary wide" id="mnext">Дальше: чтение</button><p class="xs muted">Отвечено ${answered} из ${total}</p></section>`;
    sub.querySelectorAll("[data-mg]").forEach(b=>b.onclick=()=>{const[k,j]=b.dataset.mg.split("-").map(Number);mx.ga[k]=j;keepScroll()});
    sub.querySelectorAll("[data-mf]").forEach(inp=>inp.oninput=()=>{mx.fa[inp.dataset.mf]=inp.value});
    $("#mnext").onclick=()=>{let ok=0;mx.gram.forEach((gi,k)=>{if(mx.ga[k]===GRAM[gi][3])ok++;else if(!S.miss.includes(gi))S.miss.push(gi)});mx.forms.forEach((fi,k)=>{if(check(mx.fa[k]||"",FORMS[fi][2])!=="no")ok++});
      mx.score[1]=Math.round(ok/total*100);save();mx.step=2;render();window.scrollTo(0,0)};return}
  if(mx.step===2){const qs=mockRQ();
    sub.innerHTML=stepper+mx.read.map((r,ri)=>{const D=READ[r];return `<section class="panel"><h2>${esc(D.t)}</h2><div class="reading">${esc(D.x)}</div>${D.q.map((q,k)=>{const key=ri+"-"+k;return `<p class="q" style="font-size:16px">${esc(q[0])}</p><div class="opts">${q[1].map((o,j)=>`<button class="opt ${mx.ra[key]===j?"pick":""}" data-mr="${key}-${j}">${esc(o)}</button>`).join("")}</div>`}).join("")}</section>`}).join("")+
      `<section class="panel"><button class="btn primary wide" id="mnext" ${Object.keys(mx.ra).length<qs.length?"disabled":""}>Дальше: письмо</button></section>`;
    sub.querySelectorAll("[data-mr]").forEach(b=>b.onclick=()=>{const p=b.dataset.mr.split("-");mx.ra[p[0]+"-"+p[1]]=+p[2];keepScroll()});
    $("#mnext").onclick=()=>{mx.score[2]=Math.round(qs.filter(x=>mx.ra[x.key]===x.q[2]).length/qs.length*100);mx.step=3;mx.wEnd=Date.now()+30*60e3;render();window.scrollTo(0,0)};return}
  if(mx.step===3){const w=WRITE[mx.write],words=mx.text.trim().split(/\s+/).filter(Boolean).length;
    sub.innerHTML=stepper+`<section class="panel"><div class="row between"><h2>${esc(w.t)}</h2><span class="score" id="wtimer"></span></div><p class="q" style="font-size:17px">${esc(w.task)}</p>
      <ul class="clean small">${w.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></section>
      <section class="panel" data-keybox><textarea id="mtext" lang="pl" placeholder="Pisz tutaj…">${esc(mx.text)}</textarea>${KEYS()}<span class="score" id="mwc">${words} слов</span></section>
      <section class="panel"><h2>Самопроверка</h2><p class="small muted">Честно отметь, что получилось. Каждый пункт — 1 балл.</p>
      ${[...w.pts.map(p=>"Раскрыт пункт: "+p),"Объём 100+ слов","Приветствие и прощание в нужном стиле","Есть связки (bo, dlatego, jednak…)","Нет грубых ошибок в падежах и временах"].map((c,k)=>`<div class="task" style="padding:6px 0"><input type="checkbox" id="mc${k}" data-mc="${k}" ${mx.checks[k]?"checked":""}><label for="mc${k}">${esc(c)}</label></div>`).join("")}
      <button class="btn primary wide" id="mnext">Завершить экзамен</button></section>`;
    const ta=$("#mtext");ta.oninput=()=>{mx.text=ta.value;$("#mwc").textContent=ta.value.trim().split(/\s+/).filter(Boolean).length+" слов"};
    sub.querySelectorAll("[data-mc]").forEach(c=>c.onchange=()=>{mx.checks[c.dataset.mc]=c.checked});
    const tick=()=>{const t=$("#wtimer");if(!t||!mx||mx.step!==3)return;const left=Math.max(0,Math.round((mx.wEnd-Date.now())/1000));t.textContent=left?fmt(left):"Время вышло";setTimeout(tick,1000)};tick();
    $("#mnext").onclick=()=>{const n=w.pts.length+4,ok=Object.values(mx.checks).filter(Boolean).length;mx.score[3]=Math.round(ok/n*100);mx.step=4;
      const parts=[0,1,2,3].map(i=>mx.score[i]||0),total=Math.round(parts.reduce((a,b)=>a+b,0)/4);
      S.mocks.push({date:ymd(),parts,total});addXP(50);save();render();window.scrollTo(0,0)};return}
  const parts=[0,1,2,3].map(i=>mx.score[i]||0),pass=parts.every(p=>p>=50),w=WRITE[mx.write];
  sub.innerHTML=`<section class="panel"><div class="label">Результат</div><div class="result ${pass?"pass":"fail"}">${pass?"Сдано":"Пока не сдано"}</div>
    <div class="mres">${MPARTS.map((p,i)=>`<div class="mrow"><span>${p}</span><div class="mbar"><i style="width:${parts[i]}%" class="${parts[i]>=50?"g":"b"}"></i><em></em></div><b class="${parts[i]>=50?"pass":"fail"}">${parts[i]}%</b></div>`).join("")}</div>
    <p class="small muted">Отметка на шкале — порог 50%. ${pass?"Все части выше порога. Так держать!":"Подтяни части ниже порога: план на завтра — именно они."}</p>
    <div class="row"><button class="btn primary" id="again">Новый экзамен</button><button class="btn" data-route="gram/mc/Ошибки">Ошибки грамматики</button></div></section>
    <section class="panel"><h2>Образец письма</h2><div class="reading small" style="white-space:pre-line">${esc(w.model)}</div></section>`;
  $("#again").onclick=()=>{newMock();render()};
};
function keepScroll(){const y=window.scrollY;render();window.scrollTo(0,y)}

/* ============ BOOT ============ */
R=parse(S.route||"home");if(R.tab==="words"&&R.a==="pairs")R.a=null;
render();
if("serviceWorker" in navigator&&/github\.io$|^localhost$/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();

</script>
</body>
</html>
